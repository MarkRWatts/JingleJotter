services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # SQLite database lives in the named volume below.
      DATABASE_URL: file:/app/data/jinglejotter.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET}
      # Comma-separated Google account emails allowed to sign in.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS}
      # Canonical external URL (prod: https://jinglejotter.markrwatts.com;
      # local dev via override: http://localhost:3003).
      AUTH_URL: ${AUTH_URL:-http://localhost:3003}
      # Running behind the shared Caddy edge terminating TLS.
      AUTH_TRUST_HOST: "true"
      # Field-level encryption for card-contact addresses (lib/pii.ts).
      # Optional: without it the app runs fine but saving an address is
      # refused with a friendly error. NB env-file vars only reach the
      # container when mapped here — adding to .env.docker alone isn't enough.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
    volumes:
      - data:/app/data

volumes:
  # Explicit name so the volume survives directory/project renames — Compose
  # otherwise derives the volume name from the project dir, which would
  # orphan existing data on a rename.
  data:
    name: jinglejotter_data
