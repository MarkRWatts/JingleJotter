# Auto-loaded by `docker compose` alongside docker-compose.yml whenever no
# `-f` flags are given — i.e. the Mac's local/dev workflow. Publishes `app`
# directly on the host with no reverse proxy. The VM deployment runs with
# explicit `-f docker-compose.yml -f docker-compose.prod.yml`, which skips
# this file entirely — the shared Caddy fronts `app` there instead.
services:
  app:
    ports:
      # Host port 3003 — 3000 (re:Fresh), 3001 (jobAppTracker), and
      # 3002 (filmDB/MediaVault) are taken.
      - "3003:3000"
